# DO NOT RENAME.
#
# Durable Object storage is addressed by Worker script name, so changing this
# creates a new, empty namespace and orphans every account in AuthDO and every
# room in RoomDO. The brand is "Games Dome"; this string is plumbing nobody
# sees, and it stays as it is.
name = "party-plus-room"
main = "src/do/index.ts"
compatibility_date = "2024-11-01"

# Gives the Worker a <name>.<subdomain>.workers.dev URL, which is what
# NEXT_PUBLIC_ROOM_WS_URL points at until there is a custom domain.
workers_dev = true

[observability]
enabled = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

# The user directory: accounts, and the token signing secret.
[[durable_objects.bindings]]
name = "AUTH"
class_name = "AuthDO"

# Per-IP token buckets for the endpoints reachable from outside.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiterDO"

# SQLite-backed Durable Objects.
#
# The original key-value backend (`new_classes`) requires the Workers Paid
# plan; SQLite-backed classes run on the free plan and are the current default
# for new classes. The storage API this project uses — put/get/setAlarm — is
# the same on both, so nothing in RoomDO changes.
#
# The backend can only be chosen BEFORE a class is first deployed. Do not edit
# a migration tag that has already shipped; add a new tag instead.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

# Accounts and rate limiting. A separate tag, so this is correct whether or not
# v1 has already been deployed — never edit a tag that has shipped.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["AuthDO", "RateLimiterDO"]

[vars]
# Comma-separated origins allowed to open a room socket. Empty means "allow
# any", which is right for local dev and a private test. Set it to the web
# app's origin once that is deployed, then redeploy the Worker.
ALLOWED_ORIGINS = "https://party-plus-mu.vercel.app,https://party-plus-stridr-soft.vercel.app,https://party-plus-stridrsoft-7514-stridr-soft.vercel.app"

# AUTH_SECRET signs identity tokens. Optional: leave it unset and the auth
# object generates one on first use and keeps it, so a fresh deploy works with
# no setup. Set it explicitly — as a secret, not here — if you want tokens to
# survive that object being wiped:
#   npx wrangler secret put AUTH_SECRET

# Where the web app lives. Used to build the links inside verification and
# password-reset emails, so it must be the address people can actually reach.
APP_URL = "https://party-plus-mu.vercel.app"

# Sending email needs a provider key and a from address. Leave the key unset
# and links are printed to the Worker log instead of sent — which is what makes
# the reset flow testable locally without signing up for anything.
#
# The KEY is a secret and must never live in this file, which is public:
#   npx wrangler secret put RESEND_API_KEY
#
# resend.dev is Resend's shared test domain. It sends, but it only DELIVERS to
# the address that owns the Resend account — real players will not receive
# anything until a domain of your own is verified with Resend and this is
# changed to an address on it.
EMAIL_FROM = "Games Dome <noreply@resend.dev>"

# Optional content store, so word and question packs can be updated without a
# redeploy. Neither is required — the bundled packs work on their own.
#   CONTENT_URL = "https://example.com/party-plus-packs.json"
#
# For KV instead, create it with `npx wrangler kv namespace create CONTENT`
# and uncomment:
# [[kv_namespaces]]
# binding = "CONTENT"
# id = "<namespace id>"
