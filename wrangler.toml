name = "party-plus-room"
main = "src/do/index.ts"
compatibility_date = "2024-11-01"

# Gives the Worker a <name>.<subdomain>.workers.dev URL, which is what
# NEXT_PUBLIC_ROOM_WS_URL points at until there is a custom domain.
workers_dev = true

[observability]
enabled = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomDO"

# SQLite-backed Durable Objects.
#
# The original key-value backend (`new_classes`) requires the Workers Paid
# plan; SQLite-backed classes run on the free plan and are the current default
# for new classes. The storage API this project uses — put/get/setAlarm — is
# the same on both, so nothing in RoomDO changes.
#
# The backend can only be chosen BEFORE a class is first deployed. Do not edit
# a migration tag that has already shipped; add a new tag instead.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

[vars]
# Comma-separated origins allowed to open a room socket. Empty means "allow
# any", which is right for local dev and a private test. Set it to the web
# app's origin once that is deployed, then redeploy the Worker.
ALLOWED_ORIGINS = ""

# Optional content store, so word and question packs can be updated without a
# redeploy. Neither is required — the bundled packs work on their own.
#   CONTENT_URL = "https://example.com/party-plus-packs.json"
#
# For KV instead, create it with `npx wrangler kv namespace create CONTENT`
# and uncomment:
# [[kv_namespaces]]
# binding = "CONTENT"
# id = "<namespace id>"
